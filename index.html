<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cozy Vinyl</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d0a12;--ink:#f3dfb8;--panel:#2a1a22;--edge:#f2b45a;--mute:#b99a7a}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:"Courier New",monospace;background:#1b1326;touch-action:manipulation}
#stage{position:relative}
canvas{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font:inherit;color:var(--ink);cursor:pointer}
#search{position:absolute;width:48px;height:48px;background:none;border:0;padding:0;z-index:3;-webkit-tap-highlight-color:transparent}
#panel{position:fixed;right:8px;top:calc(env(safe-area-inset-top,0px) + 52px);width:min(320px,calc(100vw - 16px));max-height:min(60vh,420px);display:none;flex-direction:column;background:rgba(42,26,34,.94);border:2px solid #7a5a3a;z-index:5;box-shadow:0 0 24px rgba(0,0,0,.6)}
#panel.open{display:flex}
#q{background:#1a0f16;border:0;border-bottom:2px solid #7a5a3a;color:var(--ink);font:16px "Courier New",monospace;padding:10px;outline:none}
#list{overflow-y:auto}
#msg{padding:12px;font-size:13px;color:var(--mute)}
.r{display:flex;gap:8px;align-items:center;padding:6px 8px;width:100%;background:none;border:0;border-bottom:1px solid #4a2e1d;text-align:left}
.r:hover,.r.on{background:#3d2530}
.r img{width:48px;height:36px;object-fit:cover;image-rendering:pixelated;flex:none}
.r b{display:block;font-size:12px;font-weight:normal;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.r i{font-size:11px;color:var(--mute);font-style:normal}
#tv{position:fixed;left:0;bottom:0;width:200px;height:200px;opacity:0;pointer-events:none;z-index:-1}#tv iframe{width:100%;height:100%}
#hit,#fire,#lamp{position:absolute;z-index:2;cursor:pointer;-webkit-tap-highlight-color:transparent}
#bar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);background:rgba(42,26,34,.92);border:2px solid #7a5a3a;padding:8px;z-index:4;opacity:0;pointer-events:none;transition:opacity .4s}
#bar.has.show{opacity:1;pointer-events:auto}
#prog{height:3px;background:#3a2a2a;margin:-2px -2px 8px}#pf{display:block;height:100%;width:0;background:#f2b45a}
#btns{display:flex;gap:6px}
#btns button{width:36px;height:32px;background:#1a0f16;border:2px solid #7a5a3a;padding:0;display:flex;align-items:center;justify-content:center}
#btns svg{width:14px;height:14px;display:block}
#vol{display:none;position:absolute;right:0;bottom:calc(100% + 8px);width:130px;box-sizing:content-box;padding:8px;background:rgba(42,26,34,.95);border:2px solid #7a5a3a;accent-color:#f2b45a}
#bar.vol #vol{display:block}
#up{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);transform:translateX(-50%);display:flex;gap:8px;align-items:center;max-width:min(86vw,420px);background:rgba(42,26,34,.92);border:2px solid #7a5a3a;padding:6px 10px 6px 6px;z-index:4;opacity:0;pointer-events:none;transition:opacity .6s}
#up.on{opacity:1}
#up img{width:44px;height:33px;object-fit:cover;image-rendering:pixelated;flex:none}
#up div{min-width:0}#up small{display:block;font:9px "Press Start 2P","Courier New",monospace;color:#f2b45a;margin-bottom:4px}
#up span{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="stage">
<canvas id="c" width="192" height="108"></canvas>
<button id="search" aria-label="Search for music"></button><div id="hit" aria-label="Play or pause"></div><div id="fire" aria-label="Fire sound on or off"></div><div id="lamp" aria-label="Lamp on or off"></div>
<div id="panel">
<input id="q" type="text" placeholder="Search a song, press Enter" autocomplete="off">
<div id="list"><div id="msg">Type a song or artist.</div></div>
</div>

</div>
<div id="bar"><div id="prog"><i id="pf"></i></div><div id="btns"><button id="bprev" aria-label="Previous song"></button><button id="bback" aria-label="Back 10 seconds"></button><button id="bpp" aria-label="Play or pause"></button><button id="bfwd" aria-label="Forward 10 seconds"></button><button id="bnext" aria-label="Next song"></button><button id="bvol" aria-label="Volume"></button></div><input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume"></div>
<div id="up"><img id="upimg" alt=""><div><small>UP NEXT</small><span id="uptxt"></span></div></div>
<div id="tv"><div id="yt"></div></div>

<script>
/* ===== 1. PASTE YOUR YOUTUBE API KEY HERE ===== */
const KEY='AIzaSyBRul6PhuQgic0zFYaNxza9-x6JVZ4fCn4';

/* ===== Scene (pixel art) ===== */
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=192;let H=108;
const px=(x,y,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(x,y,w,h)};
const stars=[[126,20],[140,18],[158,24],[132,34],[150,40],[162,16],[124,46]];
let t=0,last=0,rot=0,speed=0,playing=false,ia=0,iaT=.55,oy=0,inset=0,lampL=1,lampOn=true;
function wall(){const a=[27,19,38],b=[52,30,42];
  for(let y=-oy;y<76;y++){const k=Math.max(0,Math.floor(y/76*8)/8);
    px(0,y,W,1,`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(',')})`);}}
function windowDraw(){
  px(118,12,50,48,'#5a3a2a');px(121,15,44,42,'#101a33');px(121,15,44,14,'#14224a');
  px(141,15,2,42,'#5a3a2a');px(121,35,44,2,'#5a3a2a');px(116,58,54,3,'#7a4d31');
  px(154,20,5,5,'#f6e7b4');px(156,20,3,5,'#101a33');
  stars.forEach(([x,y],i)=>{if(Math.sin(t*2+i*1.7)>-.3)px(x,y,1,1,'#f6e7b4')});}
function table(){
  for(let y=76;y<96;y++){const k=(y-76)/20;
    px(0,y,W,1,`rgb(${Math.round(122-30*k)},${Math.round(77-20*k)},${Math.round(49-12*k)})`);}
  px(0,82,W,1,'#4f3020');px(0,89,W,1,'#4f3020');
  px(0,96,W,1,'#9a6a45');px(0,97,W,H,'#4a2e1d');px(0,102,W,1,'#3a2216');}
const mix=(a,b,k)=>{const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const x=p(a),y=p(b);return `rgb(${x.map((v,i)=>Math.round(v+(y[i]-v)*k)).join(',')})`;};
function lamp(){
  px(24,52,2,30,'#2a1a14');px(19,81,12,2,'#2a1a14');
  [[19,13],[18,15],[17,17],[16,19],[15,21],[14,23],[13,25]].forEach((r,i)=>px(r[0],40+i*2,r[1],2,mix('#8a7358',i<2?'#ffd98a':'#f2b45a',lampL)));
  px(13,54,26,1,mix('#8f7b63','#ffe9b0',lampL));}
function glow(){
  const f=1+Math.sin(t*3)*.03+Math.sin(t*7.3)*.02;
  for(let i=0;i<10;i++){const r=(14+i*9)*f;ctx.fillStyle=`rgba(255,165,70,${.04*lampL})`;
    ctx.beginPath();ctx.ellipse(26,50,r,r*.85,0,0,7);ctx.fill();}
  for(let i=0;i<6;i++){ctx.fillStyle=`rgba(255,170,80,${.035*lampL})`;
    ctx.beginPath();ctx.ellipse(60,86,30+i*14,4+i*2,0,0,7);ctx.fill();}}
function mug(){
  px(146,74,11,10,'#e8d5b0');px(146,74,11,1,'#fff3d4');px(157,76,3,1,'#e8d5b0');px(159,77,1,3,'#e8d5b0');px(157,80,3,1,'#e8d5b0');
  px(147,75,9,2,'#4a2a18');
  for(let i=0;i<5;i++){const x=151+Math.round(Math.sin(t*1.5+i)*1.5);px(x,71-i*3,1,2,`rgba(255,240,220,${.55-i*.1})`);}}
function plant(){
  px(168,74,10,8,'#b5593a');px(167,73,12,2,'#c96a47');
  const g=['#3f7d4a','#58a35f'];
  [[172,68,2,5],[168,66,2,7],[176,67,2,6],[170,63,2,5],[174,62,2,6]].forEach((l,i)=>px(l[0],l[1],l[2],l[3],g[i%2]));}
function vinyl(){
  const cx=96,cy=86,rx=44,ry=12;
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(99,cy+3,rx+2,ry+1,0,0,7);ctx.fill();
  ctx.fillStyle='#050505';ctx.beginPath();ctx.ellipse(cx,cy+2,rx,ry,0,0,7);ctx.fill();
  const TAU=Math.PI*2,wrap=v=>{v%=TAU;if(v>Math.PI)v-=TAU;if(v<-Math.PI)v+=TAU;return v};
  for(let y=cy-ry;y<=cy+ry;y++)for(let x=cx-rx;x<=cx+rx;x++){
    const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry,r=Math.hypot(dx,dy);if(r>1)continue;
    const a=Math.atan2(dy,dx),ar=a+rot;let col;
    if(r<.05)col='#1a1008';
    else if(r<.34){col=r>.3?'#f0dcae':'#e0a24a';if(r>.13&&Math.abs(wrap(ar))<.3)col='#7a2e1c';}
    else{col=(Math.floor(r*42)%3===0)?'#1b181d':'#121014';
      if(r>.97)col='#2a252b';
      if(Math.cos(2*a-.9)>.93)col='#3d3544';
      for(const k of[.5,2.2,4.1])if(r>.4&&Math.abs(wrap(ar-k))<.02)col='#322b35';}
    px(x,y,1,1,col);}}
function vignette(){ctx.lineWidth=2;ctx.strokeStyle='rgba(8,4,14,.07)';
  for(let i=0;i<8;i++)ctx.strokeRect(i*2+1,i*2+1,W-i*4-2,H-i*4-2);}
function fireplace(){
  px(58,38,48,4,'#4a3636');px(58,38,48,1,'#6a5050');
  px(62,42,40,34,'#6b3a2e');
  for(let y=44;y<76;y+=4){px(62,y,40,1,'#4a2820');
    for(let x=62+((y/4)%2?0:5);x<102;x+=10)px(x,y,1,4,'#4a2820');}
  px(69,51,26,1,'#3a1c14');px(70,52,24,24,'#1a0c08');
  px(72,72,20,3,'#4a2a18');px(74,70,16,3,'#5e3a22');px(72,72,20,1,'#6e4630');
  const base=71;
  for(let x=72;x<92;x+=2){
    const d=1-Math.abs(x+1-82)/11;
    const h=Math.max(2,Math.round((3+13*d)*(.75+.25*Math.sin(t*6+x*1.3))+Math.sin(t*11+x)*1.5));
    px(x,base-h,2,h,'#d9501f');
    const h2=Math.round(h*.65);px(x,base-h2,2,h2,'#f2a03a');
    const h3=Math.round(h*.35);px(x,base-h3,2,h3,'#ffe08a');}
  for(let i=0;i<4;i++){const p=(t*.7+i*.27)%1;
    px(76+i*5+Math.round(Math.sin(t*3+i*2)*2),Math.round(66-p*18),1,1,`rgba(255,190,90,${1-p})`);}
}
function fireGlow(){
  const f=1+Math.sin(t*9)*.05+Math.sin(t*5.3)*.04;
  for(let i=0;i<7;i++){ctx.fillStyle='rgba(255,110,40,.035)';ctx.beginPath();ctx.ellipse(82,64,(10+i*8)*f,(8+i*6)*f,0,0,7);ctx.fill();}
  ctx.fillStyle='rgba(255,120,50,.05)';ctx.beginPath();ctx.ellipse(96,88,60*f,10,0,0,7);ctx.fill();
}
function icon(){const x=W-17,y=3+inset;ctx.globalAlpha=ia;
  ctx.fillStyle='rgba(255,170,70,.18)';ctx.fillRect(x+1,y+1,9,9);
  [[3,1,4,1],[2,2,1,1],[7,2,1,1],[1,3,1,4],[8,3,1,4],[2,7,1,1],[7,7,1,1],[3,8,4,1],[8,8,2,2],[10,10,1,1]].forEach(r=>px(x+r[0],y+r[1],r[2],r[3],'#f3dfb8'));
  ctx.globalAlpha=1;}
function frame(ts){
  requestAnimationFrame(frame);
  if(ts-last<33)return;last=ts;t+=.05;
  speed+=((playing?1:0)-speed)*.04;rot+=.05*speed;ia+=(iaT-ia)*.04;lampL+=((lampOn?1:0)-lampL)*.12;
  ctx.setTransform(1,0,0,1,0,oy);wall();windowDraw();fireplace();table();lamp();mug();plant();vinyl();ctx.fillStyle=`rgba(10,6,24,${.3*(1-lampL)})`;ctx.fillRect(0,-oy,W,H);glow();fireGlow();ctx.setTransform(1,0,0,1,0,0);vignette();icon();}
requestAnimationFrame(frame);

/* ===== Search + player ===== */
const $=id=>document.getElementById(id);
let queue=[],idx=-1,player=null,ready=false,moreP=null,vol=80,wt=0,upShown=false;
const svg=b=>`<svg viewBox="0 0 12 12" fill="currentColor" shape-rendering="crispEdges">${b}</svg>`;
const I={
  prev:svg('<rect x="1" y="2" width="2" height="8"/><polygon points="10,2 10,10 4,6"/>'),
  back:svg('<polygon points="6,2 6,10 1,6"/><polygon points="11,2 11,10 6,6"/>'),
  play:svg('<polygon points="3,1 3,11 10,6"/>'),
  pause:svg('<rect x="2" y="1" width="3" height="10"/><rect x="7" y="1" width="3" height="10"/>'),
  fwd:svg('<polygon points="1,2 1,10 6,6"/><polygon points="6,2 6,10 11,6"/>'),
  next:svg('<polygon points="2,2 2,10 8,6"/><rect x="9" y="2" width="2" height="8"/>'),
  vol:svg('<rect x="1" y="4" width="3" height="4"/><polygon points="4,4 8,1 8,11 4,8"/><rect x="9" y="4" width="1" height="4"/><rect x="11" y="2" width="1" height="8"/>')};
for(const [k,id] of [['prev','bprev'],['back','bback'],['play','bpp'],['fwd','bfwd'],['next','bnext'],['vol','bvol']])$(id).innerHTML=I[k];
const dec=s=>{const x=document.createElement('textarea');x.innerHTML=s;return x.value};
function msg(text){const l=$('list');l.textContent='';const d=document.createElement('div');d.id='msg';d.textContent=text;l.appendChild(d);}

function setPanel(o){$('panel').classList.toggle('open',o);iaT=o?1:.55;if(o)$('q').focus();}
$('search').addEventListener('click',e=>{e.stopPropagation();setPanel(!$('panel').classList.contains('open'));});
$('search').addEventListener('mouseenter',()=>{iaT=1});
$('search').addEventListener('mouseleave',()=>{iaT=$('panel').classList.contains('open')?1:.55});
document.addEventListener('click',e=>{if(!$('panel').contains(e.target))setPanel(false);});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&$('q').value.trim())search($('q').value.trim());});

async function fetchItems(q){
  const u=new URL('https://www.googleapis.com/youtube/v3/search');
  Object.entries({part:'snippet',type:'video',videoCategoryId:'10',videoEmbeddable:'true',maxResults:'10',q,key:KEY})
    .forEach(([k,v])=>u.searchParams.set(k,v));
  const d=await (await fetch(u.toString())).json();
  if(d.error){const e=new Error(d.error.message);e.code=d.error.code;throw e;}
  return (d.items||[]).map(i=>({id:i.id.videoId,title:dec(i.snippet.title),ch:dec(i.snippet.channelTitle),th:i.snippet.thumbnails.default.url}));
}
async function search(q){
  if(KEY.startsWith('PASTE')){msg('Add your YouTube API key in index.html first (see the top of the script).');return;}
  msg('Searching...');
  const ck='s:'+q.toLowerCase();
  try{const cached=localStorage.getItem(ck);if(cached){show(JSON.parse(cached));return;}}catch(e){}
  try{const items=await fetchItems(q);try{localStorage.setItem(ck,JSON.stringify(items));}catch(e){}show(items);}
  catch(e){msg(e.code===403?'Search limit reached for today, or your key is not allowed on this website. Try again tomorrow.':'Could not reach YouTube ('+(e.message||'unknown')+').');}
}
function show(items){
  queue=items.slice();idx=-1;const l=$('list');l.textContent='';
  if(!items.length){msg('No results. Try different words.');return;}
  items.forEach((it,i)=>{
    const b=document.createElement('button');b.className='r';
    const im=document.createElement('img');im.src=it.th;im.alt='';
    const w=document.createElement('div');
    const t1=document.createElement('b');t1.textContent=it.title;
    const t2=document.createElement('i');t2.textContent=it.ch;
    w.append(t1,t2);b.append(im,w);b.addEventListener('click',()=>{play(i);setPanel(false);});l.appendChild(b);});
}

/* Endless mode: when the queue runs low, search for songs like the current one */
const clean=t=>t.replace(/\(.*?\)|\[.*?\]|official|video|audio|lyrics?|\bhd\b|\b4k\b|\bmv\b/gi,' ').replace(/\s+/g,' ').trim();
function more(){
  if(moreP||idx<0||KEY.startsWith('PASTE'))return moreP||Promise.resolve();
  moreP=(async()=>{
    try{const cur=queue[idx];
      for(const q of [clean(cur.title)+' '+cur.ch,cur.ch+' songs']){
        const have=new Set(queue.map(x=>x.id));
        const add=(await fetchItems(q)).filter(x=>!have.has(x.id));
        if(add.length){queue.push(...add);break;}}
    }catch(e){}
  })().finally(()=>{moreP=null;});
  return moreP;
}
async function next(){
  if(idx+1>=queue.length)await more();
  play(idx+1<queue.length?idx+1:0);
}
function play(i){
  if(!ready){msg('Player is still loading, try again in a moment.');return;}
  if(i<0||i>=queue.length)return;
  idx=i;player.loadVideoById(queue[i].id);hideUp();
  $('bar').classList.add('has');wake();
  if(i>=queue.length-3)more();
}

/* Up next preview (only in the last seconds of a song) + progress line */
function hideUp(){upShown=false;$('up').classList.remove('on');}
setInterval(()=>{
  if(!ready||!playing||idx<0)return;
  const d=player.getDuration(),c=player.getCurrentTime();
  $('pf').style.width=(d>0?Math.min(100,c/d*100):0)+'%';
  if(d>20&&d-c<=12&&d-c>0){
    const n=queue[idx+1];
    if(n){if(!upShown){upShown=true;$('upimg').src=n.th;$('uptxt').textContent=n.title;$('up').classList.add('on');}}
    else more();
  }else if(upShown)hideUp();
},500);

/* Control bar: shows when you touch the screen, fades after a few seconds */
function wake(){
  if(idx<0)return;
  $('bar').classList.add('show');clearTimeout(wt);
  wt=setTimeout(()=>{if(playing&&!$('bar').classList.contains('vol'))$('bar').classList.remove('show');},4000);
}
['pointerdown','mousemove','keydown'].forEach(ev=>document.addEventListener(ev,wake));
function toggle(){
  if(!ready||idx<0){setPanel(true);return;}
  playing?player.pauseVideo():player.playVideo();wake();
}
$('hit').addEventListener('click',e=>{e.stopPropagation();toggle();});
$('bpp').addEventListener('click',toggle);
$('bnext').addEventListener('click',()=>{if(idx>=0){next();wake();}});
$('bprev').addEventListener('click',()=>{if(!ready||idx<0)return;if(player.getCurrentTime()>3||idx===0)player.seekTo(0,true);else play(idx-1);wake();});
$('bback').addEventListener('click',()=>{if(!ready||idx<0)return;player.seekTo(Math.max(0,player.getCurrentTime()-10),true);wake();});
$('bfwd').addEventListener('click',()=>{if(!ready||idx<0)return;player.seekTo(player.getCurrentTime()+10,true);wake();});
try{const v=localStorage.getItem('vol');if(v!==null)vol=+v;}catch(e){}
$('vol').value=vol;
function setVol(v){vol=v;if(ready)player.setVolume(v);$('bvol').style.opacity=v==0?.4:1;try{localStorage.setItem('vol',v);}catch(e){}}
setVol(vol);
$('bvol').addEventListener('click',()=>{$('bar').classList.toggle('vol');wake();});
$('vol').addEventListener('input',e=>{setVol(+e.target.value);wake();});

window.onYouTubeIframeAPIReady=()=>{
  player=new YT.Player('yt',{width:'200',height:'200',playerVars:{playsinline:1,rel:0,modestbranding:1},
    events:{
      onReady:()=>{ready=true;player.setVolume(vol);},
      onStateChange:e=>{
        playing=e.data===1;$('bpp').innerHTML=playing?I.pause:I.play;
        if(e.data===0){hideUp();next();}
        if(e.data===1||e.data===2)wake();},
      onError:()=>{setTimeout(next,1200);}}});};
const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);

/* ===== Fire sound (made in code, no files). Keep low so the music stays on top ===== */
const FIRE_VOLUME=0.5; /* 0 = silent, 1 = louder. Lower it if you want it quieter. */
let ac=null,fireGain=null,fireOn=true;
try{fireOn=localStorage.getItem('fire')!=='off';}catch(e){}
function startFire(){
  if(ac){if(ac.state==='suspended')ac.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  ac=new AC();fireGain=ac.createGain();fireGain.gain.value=fireOn?FIRE_VOLUME*.5:0;fireGain.connect(ac.destination);
  const len=ac.sampleRate*2,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  let last=0;for(let i=0;i<len;i++){last=(last+.02*(Math.random()*2-1))/1.02;d[i]=last*3.5;}
  const rum=ac.createBufferSource();rum.buffer=buf;rum.loop=true;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=400;
  const rg=ac.createGain();rg.gain.value=.12;
  rum.connect(lp);lp.connect(rg);rg.connect(fireGain);rum.start();
  const nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  (function pop(){
    const s=ac.createBufferSource();s.buffer=nb;
    const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500+Math.random()*3500;bp.Q.value=1.2;
    const g=ac.createGain(),n=ac.currentTime,v=.05+Math.random()*.2;
    g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+.02+Math.random()*.05);
    s.connect(bp);bp.connect(g);g.connect(fireGain);s.start(n,Math.random()*.5,.1);
    setTimeout(pop,60+Math.random()*(Math.random()<.2?900:350));
  })();
}
['click','touchend','keydown'].forEach(ev=>document.addEventListener(ev,startFire));
$('fire').addEventListener('click',e=>{e.stopPropagation();
  if(!ac){startFire();return;}
  fireOn=!fireOn;fireGain.gain.setTargetAtTime(fireOn?FIRE_VOLUME*.5:0,ac.currentTime,.1);
  try{localStorage.setItem('fire',fireOn?'on':'off');}catch(e){}});
try{lampOn=localStorage.getItem('lamp')!=='off';lampL=lampOn?1:0;}catch(e){}
$('lamp').addEventListener('click',e=>{e.stopPropagation();lampOn=!lampOn;
  try{localStorage.setItem('lamp',lampOn?'on':'off');}catch(e){}});
function resize(){
  const vw=innerWidth,vh=innerHeight,Hl=Math.max(108,Math.round(192*vh/vw));
  const cw=Hl===108?Math.min(vw,vh*192/108):vw,sc=cw/192;
  H=Hl;c.width=192;c.height=Hl;oy=Math.floor((Hl-108)/2);
  const st=$('stage').style;st.width=c.style.width=cw+'px';st.height=c.style.height=(cw*Hl/192)+'px';
  const p=document.createElement('div');p.style.cssText='position:fixed;top:0;padding-top:env(safe-area-inset-top,0px)';
  document.body.appendChild(p);inset=Math.round(p.offsetHeight/sc);p.remove();
  const b=$('search').style;b.left=((W-12)*sc-24)+'px';b.top=((8+inset)*sc-24)+'px';
  const h=$('hit').style;h.left=52*sc+'px';h.top=(70+oy)*sc+'px';h.width=88*sc+'px';h.height=32*sc+'px';
  const f=$('fire').style;f.left=58*sc+'px';f.top=(40+oy)*sc+'px';f.width=48*sc+'px';f.height=30*sc+'px';
  const l=$('lamp').style;l.left=12*sc+'px';l.top=(38+oy)*sc+'px';l.width=28*sc+'px';l.height=46*sc+'px';}
addEventListener('resize',resize);resize();
</script>
